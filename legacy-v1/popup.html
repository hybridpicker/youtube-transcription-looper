<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Transkript-Loop</title></head>
<body><main><h1>Transkript-Loop</h1><div class="range"><label>A / Start<input id="start" inputmode="decimal" aria-label="Startzeit"></label><label>B / Ende<input id="end" inputmode="decimal" aria-label="Endzeit"></label></div><div class="controls"><button id="set-start">A bei Wiedergabe</button><button id="set-end">B bei Wiedergabe</button><button id="toggle" class="primary">Loop einschalten</button><button id="clear">Loop löschen</button></div><button id="show" class="link">Steuerung im Video ausblenden</button><button id="open-app" class="link">Audiodatei-Werkstatt öffnen</button><p id="hint">Öffne ein YouTube-Video.</p><footer>Zeitformat: MM:SS.ss oder Sekunden · Alt+[ / Alt+] · Alt+L</footer></main><script src="popup.js"></script></body></html>
