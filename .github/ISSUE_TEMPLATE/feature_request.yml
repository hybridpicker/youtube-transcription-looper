name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation while practising or transcribing, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - YouTube panel
        - Workstation (audio files)
        - Both
